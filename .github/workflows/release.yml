# Build AI BIT for iOS and hand it to TestFlight, without owning a Mac.
#
# THE POINT
# iOS apps can only be compiled and signed on macOS. This runs the build on
# GitHub's macOS runners and uploads the result to App Store Connect, so the
# whole release happens from a Windows machine with nothing but a git push.
#
# This is adapted from safenest-mobile's release.yml, which already ships to
# TestFlight from this same Apple account. The keychain handling below is the
# part worth preserving verbatim — every line of it exists because a build
# failed without it, and the failures all report themselves as something else.
#
# THE SECRETS
# Only the iOS job needs any, and they are Apple's rather than this app's.
#
#   APPLE_ID               the Apple ID that owns the developer account
#   APPLE_APP_PASSWORD     an app-specific password from appleid.apple.com
#   APPLE_TEAM_ID          P57Y6ND67Y
#   IOS_CERT_P12_BASE64    the distribution certificate, base64
#   IOS_CERT_PASSWORD      its password
#   IOS_PROFILE_BASE64     the AI BIT provisioning profile, base64
#
# The certificate is per-team and is the same one SafeNest uses. The
# provisioning profile is NOT — it is tied to a bundle id, so AI BIT needs its
# own. See TESTFLIGHT.md.
name: Release

# DELIBERATE RELEASES ONLY — a tag, or the button. Never an ordinary commit.
#
# A macOS runner bills at ten times the Linux rate, and a build that reaches
# TestFlight puts something in front of testers. Neither should happen because
# somebody edited a file. Pushing a tag is an act with no other purpose.
#
#   git tag v1.0.0 && git push origin v1.0.0        <- builds iOS, ships to TestFlight
#   git tag android-1.0.0 && git push origin android-1.0.0   <- APK only, no macOS runner
on:
  push:
    tags: ["v*", "android-*"]
  workflow_dispatch:
    inputs:
      android:
        description: "Also build the Android APK"
        type: boolean
        default: false

jobs:
  ios:
    name: iOS
    # `v*` only. An android-* tag must not spend a macOS runner.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # analyze and test BEFORE anything expensive. On macOS a minute bills as
      # ten, so failing fast on a compile error costs a tenth of failing slowly
      # after an archive.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Skipped rather than failed when the Apple secrets are absent, so the
      # workflow does not go permanently red before the account is wired up.
      # A workflow that is red for a thing you chose not to do teaches people to
      # ignore it being red.
      # Every secret the job needs, checked together and BEFORE the archive.
      # Gating on the certificate alone meant a missing upload credential still
      # spent a full macOS archive — billed at ten times the Linux rate — only
      # to fail on the last step.
      - name: Is everything Apple needs configured?
        id: apple
        run: |
          MISSING=""
          [ -n "${{ secrets.IOS_CERT_P12_BASE64 }}" ] || MISSING="$MISSING IOS_CERT_P12_BASE64"
          [ -n "${{ secrets.IOS_CERT_PASSWORD }}"   ] || MISSING="$MISSING IOS_CERT_PASSWORD"
          [ -n "${{ secrets.IOS_PROFILE_BASE64 }}"  ] || MISSING="$MISSING IOS_PROFILE_BASE64"
          [ -n "${{ secrets.APPLE_TEAM_ID }}"       ] || MISSING="$MISSING APPLE_TEAM_ID"
          [ -n "${{ secrets.APPLE_ID }}"            ] || MISSING="$MISSING APPLE_ID"
          [ -n "${{ secrets.APPLE_APP_PASSWORD }}"  ] || MISSING="$MISSING APPLE_APP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "missing=$MISSING" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Install the signing certificate
        if: steps.apple.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          # A throwaway keychain for this run. Importing into the login keychain
          # of a shared runner would leave a certificate on someone else's machine.
          security create-keychain -p runner build.keychain
          security unlock-keychain -p runner build.keychain

          # THE SEARCH LIST IS THE PART THAT MATTERS. `default-keychain` alone is
          # not enough: codesign looks through the SEARCH list, so a keychain that
          # is default but unlisted holds a certificate nobody can find. The error
          # says "no valid code signing certificates were found" and points at
          # Xcode signing settings — nowhere near the actual cause.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          security default-keychain -s build.keychain

          # Do not auto-lock. The default is a few minutes; an archive can take
          # longer, and a keychain that locks halfway through fails with the same
          # misleading "no certificates" message.
          security set-keychain-settings -lut 21600 build.keychain

          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for permission to use the key — and a
          # runner has nobody to answer, so it hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain

          # Named by UUID, which is how Xcode indexes them. A profile copied under
          # its download name is often simply not seen.
          UUID=$(security cms -D -i /tmp/profile.mobileprovision \
                 | plutil -extract UUID raw -o - -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision \
             ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "installed profile $UUID"

          # Proof it is actually visible, printed BEFORE the build. When this is
          # empty the build fails minutes later blaming Xcode settings, and this
          # line is the difference between diagnosing it and guessing.
          security find-identity -v -p codesigning build.keychain

          rm -f /tmp/cert.p12 /tmp/profile.mobileprovision

      # The profile in ExportOptions.plist must match the app's bundle id, and a
      # mismatch surfaces as a generic signing failure after the archive. Ten
      # seconds here saves a twenty-minute round trip.
      - name: Bundle id and profile agree
        if: steps.apple.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # PlistBuddy prints the dict as "    <bundle-id> = <profile name>".
          WANT=$(/usr/libexec/PlistBuddy -c "Print :provisioningProfiles" \
                 ios/ExportOptions.plist \
                 | sed -n 's/^ *\([A-Za-z0-9._-][A-Za-z0-9._-]*\) = .*/\1/p' | head -1)
          # The first bundle id in the project is Runner's; the RunnerTests one
          # follows it and is irrelevant to the export.
          HAVE=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' \
                 ios/Runner.xcodeproj/project.pbxproj | sed 's/.*= //')
          echo "ExportOptions expects: $WANT"
          echo "Xcode project builds:  $HAVE"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Bundle id mismatch. The export would be signed with a"
            echo "::error::profile that does not cover the app being built."
            exit 1
          fi

      # Apple rejects an upload for a missing purpose string, but only after
      # the archive has been built and pushed -- a ~20 minute round trip for a
      # one-line omission. It scans the linked binary, not the code paths
      # taken, so a plugin that merely *references* a protected API demands the
      # string even when nothing calls it. Shipping the add-only Photos key was
      # rejected for exactly this reason (error 90683).
      - name: Purpose strings present for the plugins in use
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          fail=0
          need() {  # need <pubspec-package> <Info.plist key...>
            local pkg="$1"; shift
            grep -qE "^\s{2}$pkg:" pubspec.yaml || return 0
            for key in "$@"; do
              if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
                echo "  ok      $pkg -> $key"
              else
                echo "::error::$pkg is a dependency but $PLIST has no $key"
                fail=1
              fi
            done
          }
          need gal NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription
          need image_picker NSPhotoLibraryUsageDescription NSCameraUsageDescription
          need record NSMicrophoneUsageDescription
          need geolocator NSLocationWhenInUseUsageDescription
          # FFmpeg links AVFoundation's capture APIs for joining HD downloads.
          # Nothing here opens a camera or a microphone, but Apple scans the
          # linked binary rather than the code paths taken and rejects the
          # upload without both strings. Caught here it costs nothing; caught
          # at upload it costs a build number and a round trip.
          need ffmpeg_kit_flutter_new NSCameraUsageDescription NSMicrophoneUsageDescription
          exit $fail

      - name: Build the signed app
        if: steps.apple.outputs.ready == 'true'
        env:
          # Told explicitly rather than discovered. Without it Xcode tries to work
          # the team out from a signed-in account, and a runner has none — which
          # fails identically to the keychain problem and reads the same way.
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The tag is the source of truth, not a file somebody has to
          # remember to edit. VERSION sat at 1.6.0 while four releases went
          # out under later tags, so TestFlight showed a version that had not
          # been true for weeks and only the build number told them apart. A
          # workflow_dispatch run has no tag, so it falls back to the file.
          BUILD_NAME="$(printf '%s' '${{ github.ref_name }}' | sed -E 's/^(v|android-)//')"
          case "$BUILD_NAME" in
            *[!0-9.]* | '') BUILD_NAME="$(cat VERSION)" ;;
          esac
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Send it to TestFlight
        if: steps.apple.outputs.ready == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"
          echo "Uploaded. Apple takes 5-15 minutes to process before it appears"
          echo "in TestFlight."

      # Kept regardless, so a failed upload does not mean a rebuild. The .ipa can
      # be uploaded by hand from Transporter on any Mac.
      - uses: actions/upload-artifact@v4
        if: steps.apple.outputs.ready == 'true'
        with:
          name: aibit-ios
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Say plainly which secrets are missing
        if: steps.apple.outputs.ready != 'true'
        run: |
          echo "::warning::Skipped the iOS build. Missing secrets:"
          echo "::warning::  ${{ steps.apple.outputs.missing }}"
          echo "::warning::Add them under Settings > Secrets and variables >"
          echo "::warning::Actions, then delete and re-push the tag:"
          echo "::warning::  git tag -d v1.0.0 && git push origin :v1.0.0"
          echo "::warning::  git tag v1.0.0 && git push origin v1.0.0"

  android:
    name: Android
    # Only when asked for. This app's real target is iOS; the APK exists so it
    # can be sideloaded onto a phone for testing without an Apple account.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.android)
          || startsWith(github.ref, 'refs/tags/android-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # No upload signing config, so this is signed with the debug key. Fine for
      # sideloading onto your own phone; it could not go to Play, which this app
      # must not do anyway.
      - name: Build the APK
        run: |
          # The tag is the source of truth, not a file somebody has to
          # remember to edit. VERSION sat at 1.6.0 while four releases went
          # out under later tags, so TestFlight showed a version that had not
          # been true for weeks and only the build number told them apart. A
          # workflow_dispatch run has no tag, so it falls back to the file.
          BUILD_NAME="$(printf '%s' '${{ github.ref_name }}' | sed -E 's/^(v|android-)//')"
          case "$BUILD_NAME" in
            *[!0-9.]* | '') BUILD_NAME="$(cat VERSION)" ;;
          esac
          # Split per ABI. R8 is off, so a fat APK carrying every architecture
          # is ~240MB and slow to move to a phone; the arm64 slice alone is
          # ~80MB. Almost every real device since 2017 is arm64-v8a.
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }}
          # A stable name for the slice nearly every phone needs, so consumers
          # of the artifact do not depend on the version in the filename.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aibit-android
          # Every slice plus the arm64 copy named app-release.apk. armeabi-v7a
          # covers the rare 32-bit device; x86_64 is for emulators.
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
